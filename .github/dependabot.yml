version: 2

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps/backend)"
    groups:
      go-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps/frontend)"
    groups:
      npm-patch-minor:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
