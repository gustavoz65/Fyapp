  trivy-backend:
    name: Trivy (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: backend
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          exit-code: 0

  trivy-frontend:
    name: Trivy (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: frontend
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          exit-code: 0

  trivy-docker-backend:
    name: Trivy (Dockerfile Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t Fy-backend:ci backend/

      - uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: Fy-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  trivy-docker-frontend:
    name: Trivy (Dockerfile Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t Fy-frontend:ci frontend/

      - uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: Fy-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
