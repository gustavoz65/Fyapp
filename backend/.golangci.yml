run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    # Critical - bugs and correctness
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

    # Important - best practices
    - bodyclose
    - copyloopvar
    - durationcheck
    - gosec
    - sqlclosecheck

    # Nice to have - code quality
    - goimports
    - unconvert

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (*database/sql.Rows).Close
      - (io.Closer).Close

  govet:
    enable:
      - shadow
    settings:
      shadow:
        strict: false

  gosec:
    excludes:
      - G115  # integer overflow conversion - too many false positives
      - G112  # potential slowloris - handled at infrastructure level


issues:
  max-same-issues: 50
  exclude-use-default: false
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: "_test\\.go"
      linters:
        - bodyclose
        - errcheck
        - gosec
        - govet

    # Allow type assertions in handlers (needed for response handling)
    - path: "internal/handler/"
      linters:
        - errcheck
      text: "Error return value is not checked"

    # Allow shadow in repository layer (common pattern with err variable)
    - path: "internal/repository/"
      linters:
        - govet
      text: "shadow: declaration of"

    # Allow shadow in service layer
    - path: "internal/service/"
      linters:
        - govet
      text: "shadow: declaration of"

    # Blank imports are OK in some places
    - path: "internal/(config|database|validation)/"
      linters:
        - typecheck
      text: "could not import"
