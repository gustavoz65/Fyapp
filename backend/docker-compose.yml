version: "3.8"
services:
  redis:
    image: redis:7.2
    container_name: redis_cashing
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight_cashing
    ports:
      - "8001:8001"
    depends_on:
      - redis

volumes:
  mysql_data:
  redis_data:
