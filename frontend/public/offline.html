<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiNext - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-block;
      text-decoration: none;
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar à internet. Verifique sua conexão e tente novamente.</p>
    <button class="button" onclick="window.location.reload()">Tentar Novamente</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    // Detecta quando a conexão volta
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = 'Conexão restaurada! Recarregando...';
      setTimeout(() => window.location.reload(), 1000);
    });

    window.addEventListener('offline', () => {
      document.getElementById('status').textContent = 'Sem conexão';
    });

    // Status inicial
    if (!navigator.onLine) {
      document.getElementById('status').textContent = 'Sem conexão';
    }
  </script>
</body>
</html>
